[package]
name = "microblocks-qol-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
scap = { path = "../../third_party/scap" }
ffmpeg-next = { version = "9.0.0", optional = true, default-features = false, features = ["codec", "format", "software-scaling"] }

[dev-dependencies]
tempfile = "3"

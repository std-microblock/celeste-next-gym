name: Deploy web to EdgeOne Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Yarn 4
        run: corepack enable

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build WASM browser bundle
        run: node scripts/build-wasm.mjs

      - name: Install dependencies
        run: yarn install
        working-directory: web

      - name: Test WASM bundle
        run: yarn test:wasm
        working-directory: web

      - name: Test web app
        run: yarn test
        working-directory: web

      - name: Build web app
        run: yarn build
        working-directory: web

      - name: Deploy to EdgeOne Pages
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGE_ONE_KEY }}
          EDGEONE_PROJECT_NAME: celeste-next-gym
        working-directory: web
        run: |
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::Repository secret EDGE_ONE_KEY is not configured"
            exit 1
          fi

          npx --yes edgeone@1.6.18 makers deploy dist \
            --name "$EDGEONE_PROJECT_NAME" \
            --env production \
            --token "$EDGEONE_API_TOKEN"
